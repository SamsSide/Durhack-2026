name: Human test
description: Something a person should try by hand. Agents only smoke-test; people do the real testing.
title: "[test] "
labels: ["human-test"]
body:
  - type: input
    id: what
    attributes: { label: "What to test (one line)" }
    validations: { required: true }
  - type: input
    id: where
    attributes: { label: "Where", placeholder: "PR #12 / branch a/upload / main at abc1234" }
    validations: { required: true }
  - type: textarea
    id: setup
    attributes: { label: "Setup", description: "How to run it: commands, env vars, test data.", render: bash }
  - type: textarea
    id: steps
    attributes: { label: "Steps and expected result", value: "1. \n   → expect: \n2. \n   → expect: " }
    validations: { required: true }
  - type: textarea
    id: risky
    attributes: { label: "Most likely to break", description: "Edge cases the agent was unsure about." }
